name: tests

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5.0.0

      - name: Setup Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Install FUSE
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config fuse3
          sudo modprobe fuse || true
          sudo chmod 666 /dev/fuse
          sudo sed -i 's/^#user_allow_other/user_allow_other/' /etc/fuse.conf

      # dl.min.io no longer serves community releases (HTTP 410), so use the
      # binary attached to the pinned GitHub release, checked against its hash.
      - name: Install MinIO
        env:
          MINIO_RELEASE: RELEASE.2025-09-07T16-13-09Z
          MINIO_SHA256: 7c5bd8512c6e966455b1d198209358b2d191c77a83ab377c4073281065fb855f
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/minio/minio/releases/download/$MINIO_RELEASE/minio.linux-amd64.$MINIO_RELEASE" \
            -o "$HOME/.local/bin/minio"
          echo "$MINIO_SHA256  $HOME/.local/bin/minio" | sha256sum -c -
          chmod +x "$HOME/.local/bin/minio"
          "$HOME/.local/bin/minio" --version
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run tests
        run: make test

      - name: Run tests with race detection
        run: make race

      - name: Run coverage
        run: make coverage
